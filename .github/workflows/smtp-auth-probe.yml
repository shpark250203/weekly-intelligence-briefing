# GA-2B — SMTP AUTH Probe
#
# 목적: GitHub Actions 러너에서 Gmail SMTP **인증까지** 가능한지 확인한다.
#       GA-2(smtp-probe.yml)는 EHLO까지만 확인했고 AUTH는 수행하지 않았다.
#
# 수행하는 SMTP 절차 (이게 전부다):
#   1 TCP connect  2 EHLO  3 STARTTLS  4 TLS 인증서 검증
#   5 EHLO again   6 LOGIN  7 NOOP     8 QUIT
#
# 절대 하지 않는 것 (코드에 존재하지 않으며, 실행 전 정적 검사로 재확인한다):
#   - sendmail() / send_message() / MAIL FROM / RCPT TO / DATA
#   - 실제 메일 발송, Draft 생성
#   - Secret 값 출력 (App Password·username 전체)
#   - TLS 검증 비활성화 (check_hostname / verify_mode 를 건드리지 않는다)
#   - schedule 자동 실행 (workflow_dispatch 전용)
#   - 저장소 쓰기 (permissions: contents: read, checkout 하지 않음)
#
# 출력: TCP / TLS / AUTH / NOOP / Overall 의 PASS·FAIL 과
#       실패 시 아래 뿐이다.
#         - SMTP response code
#         - Sanitized SMTP response message (자격증명·메일주소 제거 후)
#         - AUTH_FAIL_REASON
#           APP_PASSWORD_REQUIRED / BAD_CREDENTIALS / BROWSER_LOGIN_REQUIRED
#           / ACCOUNT_POLICY / SERVER_DISCONNECTED / UNKNOWN

name: GA-2B SMTP AUTH Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga2b-smtp-auth-probe
  cancel-in-progress: false

jobs:
  auth-probe:
    name: Probe Gmail SMTP AUTH (no mail sent)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Write probe script
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/ga2b"
          cat > "${RUNNER_TEMP}/ga2b/auth_probe.py" <<'PYEOF'
          # GA-2B SMTP AUTH Probe — 인증까지만 확인한다. 메일을 보내지 않는다.
          import os
          import re
          import smtplib
          import socket
          import ssl

          HOST = "smtp.gmail.com"
          PORT = 587
          TIMEOUT = 30

          steps = {"TCP": "FAIL", "TLS": "FAIL", "AUTH": "FAIL", "NOOP": "FAIL"}
          category = None
          smtp_code = None
          auth_response = None
          auth_fail_reason = None
          notes = []
          tls_proto = None
          tls_cipher = None


          class ProbeStop(Exception):
              pass


          def mask_email(value):
              """s***@gmail.com 형태로만 남긴다. 전체 주소를 출력하지 않는다."""
              if not value or "@" not in value:
                  return "(형식 확인 불가)"
              local, _, domain = value.partition("@")
              head = local[0] if local else "?"
              return head + "***@" + domain


          user_raw = os.environ.get("GMAIL_USERNAME", "")
          pw_raw = os.environ.get("GMAIL_APP_PASSWORD", "")

          user = user_raw.strip()
          # 앞뒤 여백 + 내부 공백(스페이스·탭·개행)을 모두 제거한다.
          # 제거 사실만 NOTE로 남기고, 값도 길이도 출력하지 않는다.
          pw = "".join(pw_raw.split())

          if pw_raw != pw:
              notes.append(
                  "App Password에 공백·여백이 포함되어 있어 제거 후 인증했다. "
                  "Secret을 공백 없이 다시 저장할 것을 권고한다. (값·길이 미출력)"
              )
          if user_raw != user:
              notes.append("GMAIL_USERNAME에 여백이 포함되어 있어 제거 후 인증했다.")


          def sanitize_smtp_message(raw):
              """Google 응답 문구에서 자격증명·메일주소를 제거한 형태만 남긴다.

              - Secret 값이 응답에 섞여 들어오는 경우까지 방어적으로 치환한다.
              - 메일주소는 전체를 남기지 않는다.
              - 길이 정보를 노출하지 않기 위해 300자에서 자른다(고정 상한).
              """
              if raw is None:
                  return None
              if isinstance(raw, (bytes, bytearray)):
                  text = bytes(raw).decode("utf-8", "replace")
              else:
                  text = str(raw)
              text = " ".join(text.split())
              for secret in (pw, pw_raw, user, user_raw):
                  if secret and len(secret) >= 4:
                      text = text.replace(secret, "[REDACTED]")
              text = re.sub(
                  r"[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+", "[REDACTED-EMAIL]", text
              )
              if len(text) > 300:
                  text = text[:300] + " ...(truncated)"
              return text


          def classify_auth_failure(code, text):
              """SMTP 인증 실패를 미리 정의된 사유 하나로만 환원한다.

              Gmail은 같은 534에 서로 다른 조치를 요구하는 세부코드를 붙인다.
                534-5.7.9  → App Password 가 아닌 자격증명을 보냈다
                534-5.7.14 → 브라우저 로그인(기기 확인)이 필요하다
              코드만으로는 이 둘이 구분되지 않으므로 문구를 먼저 본다.
              """
              t = (text or "").lower()
              if "application-specific password" in t or "5.7.9" in t:
                  return "APP_PASSWORD_REQUIRED"
              if (
                  "web browser" in t
                  or "5.7.14" in t
                  or "websignin" in t
                  or "signin/continue" in t
              ):
                  return "BROWSER_LOGIN_REQUIRED"
              if (
                  "username and password not accepted" in t
                  or "badcredentials" in t
                  or "5.7.8" in t
              ):
                  return "BAD_CREDENTIALS"
              if (
                  "disabled" in t
                  or "suspended" in t
                  or "not enabled" in t
                  or "administrator" in t
                  or "policy" in t
                  or "not allowed" in t
              ):
                  return "ACCOUNT_POLICY"
              if code == 535:
                  return "BAD_CREDENTIALS"
              # 534 인데 세부코드가 안 잡히면 추측하지 않는다.
              return "UNKNOWN"

          smtp = None
          try:
              if not user or not pw:
                  category = "SECRET_MISSING"
                  raise ProbeStop()

              # 1) TCP connect
              sock = socket.create_connection((HOST, PORT), timeout=TIMEOUT)
              sock.close()
              steps["TCP"] = "PASS"

              # 2) EHLO
              smtp = smtplib.SMTP(HOST, PORT, timeout=TIMEOUT)
              code, _ = smtp.ehlo()
              if code != 250:
                  category = "EHLO_UNEXPECTED"
                  smtp_code = code
                  raise ProbeStop()

              # 3) STARTTLS + 4) 인증서 검증
              #    create_default_context() 는 check_hostname=True,
              #    verify_mode=CERT_REQUIRED 상태다. 이 값을 낮추지 않는다.
              ctx = ssl.create_default_context()
              if not ctx.check_hostname or ctx.verify_mode != ssl.CERT_REQUIRED:
                  category = "TLS_CONTEXT_WEAKENED"
                  raise ProbeStop()
              smtp.starttls(context=ctx)
              steps["TLS"] = "PASS"
              try:
                  tls_proto = smtp.sock.version()
                  cipher = smtp.sock.cipher()
                  tls_cipher = cipher[0] if cipher else None
              except Exception:
                  pass

              # 5) EHLO again
              code, _ = smtp.ehlo()
              if code != 250:
                  category = "EHLO2_UNEXPECTED"
                  smtp_code = code
                  raise ProbeStop()

              # 6) LOGIN  — 인증만 한다
              smtp.login(user, pw)
              steps["AUTH"] = "PASS"

              # 7) NOOP
              code, _ = smtp.noop()
              if code == 250:
                  steps["NOOP"] = "PASS"
              else:
                  category = "NOOP_UNEXPECTED"
                  smtp_code = code

          except ProbeStop:
              pass
          except ssl.SSLCertVerificationError:
              category = "TLS_CERT_VERIFY_FAILED"
          except ssl.SSLError:
              category = "TLS_HANDSHAKE_ERROR"
          except smtplib.SMTPAuthenticationError as e:
              # 인증 거부는 별도로 받는다. 원문 대신 **정제된 문구**만 기록한다.
              # 정제 후에도 자격증명이 남지 않는다 (sanitize_smtp_message 참조).
              category = "AUTH_REJECTED"
              smtp_code = getattr(e, "smtp_code", None)
              auth_response = sanitize_smtp_message(getattr(e, "smtp_error", None))
              auth_fail_reason = classify_auth_failure(smtp_code, auth_response)
          except smtplib.SMTPNotSupportedError:
              category = "STARTTLS_NOT_SUPPORTED"
          except smtplib.SMTPServerDisconnected:
              category = "SERVER_DISCONNECTED"
              # TLS 이후 끊겼다면 인증 단계에서의 절단이다.
              if steps["TLS"] == "PASS" and steps["AUTH"] == "FAIL":
                  auth_fail_reason = "SERVER_DISCONNECTED"
          except smtplib.SMTPResponseException as e:
              category = "SMTP_RESPONSE_ERROR"
              smtp_code = getattr(e, "smtp_code", None)
          except smtplib.SMTPException as e:
              category = "SMTP_ERROR_" + type(e).__name__
          except socket.timeout:
              category = "TCP_TIMEOUT"
          except OSError as e:
              category = "SOCKET_ERROR_" + type(e).__name__
          finally:
              # 8) QUIT
              if smtp is not None:
                  try:
                      smtp.quit()
                  except Exception:
                      pass

          overall = "PASS" if all(v == "PASS" for v in steps.values()) else "FAIL"

          lines = []
          lines.append("| 단계 | 결과 |")
          lines.append("|---|---|")
          lines.append("| TCP | **%s** |" % steps["TCP"])
          lines.append("| TLS | **%s** |" % steps["TLS"])
          lines.append("| AUTH | **%s** |" % steps["AUTH"])
          lines.append("| NOOP | **%s** |" % steps["NOOP"])
          lines.append("| **Overall** | **%s** |" % overall)

          diag = []
          diag.append("- 계정: `%s` (마스킹)" % mask_email(user))
          if tls_proto:
              diag.append("- TLS: %s / %s" % (tls_proto, tls_cipher or "-"))
          if category:
              diag.append("- 오류 category: `%s`" % category)
          if smtp_code is not None:
              diag.append("- SMTP response code: `%s`" % smtp_code)
          if auth_response is not None:
              diag.append(
                  "- Sanitized SMTP response message: `%s`" % auth_response
              )
          if auth_fail_reason:
              diag.append("- **AUTH_FAIL_REASON: `%s`**" % auth_fail_reason)
          for n in notes:
              diag.append("- NOTE: %s" % n)
          diag.append("- 발송 API 호출: **없음** (메일 전송 명령을 사용하지 않았다)")

          body = "\n".join(lines) + "\n\n" + "\n".join(diag) + "\n"

          print(body)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## GA-2B SMTP AUTH Probe\n\n")
                  fh.write(body)
                  fh.write("\n> 이 실행은 메일을 보내지 않았다. ")
                  fh.write("LOGIN 성공 여부만 확인하고 NOOP 후 QUIT 했다.\n")

          raise SystemExit(0 if overall == "PASS" else 1)
          PYEOF
          echo "probe script written."

      - name: Guard — 발송 명령이 없는지 정적 검사
        run: |
          set -uo pipefail
          SCRIPT="${RUNNER_TEMP}/ga2b/auth_probe.py"
          echo "금지 호출 검사 (주석 제외, 호출 구문만):"
          if grep -nE '^[^#]*(\.(sendmail|send_message)[[:space:]]*\(|docmd[[:space:]]*\([[:space:]]*.(MAIL|RCPT|DATA))' "$SCRIPT"; then
            echo "::error::발송 관련 호출이 발견되었다. 실행을 중단한다."
            exit 1
          fi
          echo "  -> 0건. 발송 경로 없음 확인."
          echo "TLS 검증 무력화 검사:"
          if grep -nE '^[^#]*(CERT_NONE|check_hostname\s*=\s*False|_create_unverified)' "$SCRIPT"; then
            echo "::error::TLS 검증을 낮추는 코드가 발견되었다. 실행을 중단한다."
            exit 1
          fi
          echo "  -> 0건. 인증서 검증 유지 확인."
          echo "Secret 길이·값 출력 검사:"
          if grep -nE '^[^#]*len\([[:space:]]*(pw|pw_raw|user|user_raw)[[:space:]]*\)' "$SCRIPT" \
             | grep -vE 'len\((pw|pw_raw|user|user_raw)\)[[:space:]]*>=[[:space:]]*4'; then
            echo "::error::Secret 길이를 노출할 수 있는 코드가 발견되었다. 실행을 중단한다."
            exit 1
          fi
          if grep -nE '^[^#]*(print|append|write)\(.*(\bpw\b|pw_raw)' "$SCRIPT"; then
            echo "::error::App Password 를 출력하는 코드가 발견되었다. 실행을 중단한다."
            exit 1
          fi
          echo "  -> 0건. 값·길이 미출력 확인."
          echo "debuglevel 검사:"
          if grep -nE '^[^#]*set_debuglevel' "$SCRIPT"; then
            echo "::error::set_debuglevel 은 자격증명을 로그에 출력한다. 실행을 중단한다."
            exit 1
          fi
          echo "  -> 0건."

      - name: Run SMTP AUTH probe
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -uo pipefail
          python3 --version
          python3 "${RUNNER_TEMP}/ga2b/auth_probe.py"
